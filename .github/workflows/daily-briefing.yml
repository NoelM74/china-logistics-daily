name: Daily briefing

on:
  schedule:
    # 05:30 UTC = 06:30 Irish time in winter, 07:30 in summer. The pipeline
    # takes a couple of minutes and Cloudflare Pages builds in about one, so
    # the briefing is live comfortably before 07:00 either way.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to generate (YYYY-MM-DD). Blank = today in Europe/Dublin.'
        required: false
        type: string
      force:
        description: 'Overwrite an existing briefing for that date'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Generate and validate but do not commit'
        required: false
        type: boolean
        default: false
      test_alarm:
        description: 'Exercise the failure alarm on this run (it normally only arms on the schedule)'
        required: false
        type: boolean
        default: false

# Never let two runs commit to main at the same time.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only needed if the key is identity-linked rather than
          # workspace-scoped. Harmless when unset.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "node scripts/generate-briefing.mjs $ARGS"
          node scripts/generate-briefing.mjs $ARGS

      # Belt and braces: the generator validates before writing, but this also
      # catches a briefing edited by hand between runs.
      - name: Validate all committed briefings
        if: ${{ inputs.dry_run != true }}
        run: npm run content:check

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$(git status --porcelain src/content/briefings)" ]; then
            echo "No new briefing to commit."
            exit 0
          fi
          git config user.name  "china-logistics-daily[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/briefings
          DATE=$(git diff --cached --name-only | head -1 | xargs -n1 basename | sed 's/\.json$//')
          git commit -m "Briefing ${DATE}"
          # A push can race the human pushing to main; rebase and retry once.
          git push || (git pull --rebase --autostash && git push)

  # Runs on every push so a broken build or a failed audit is caught here
  # rather than by Cloudflare Pages.
  verify:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.dry_run != true }}
    needs: generate

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run audit

  # An alarm nobody sees is not an alarm. GitHub emails the repo owner when a
  # scheduled run fails and those get filtered into oblivion, so this opens a
  # real issue instead, comments on it if one is already open rather than
  # spamming new ones, and closes it once a run succeeds again.
  #
  # It also catches the quieter failure: a run that reports success but commits
  # nothing, leaving the site serving stale content while every job is green.
  #
  # Armed on the schedule only. A manual run has a human watching it, and this
  # would otherwise file an issue every time someone backfills a date. Pass
  # test_alarm to exercise it deliberately.
  alarm:
    name: Alarm
    runs-on: ubuntu-latest
    needs: [generate, verify]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.test_alarm) }}
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assess the run
        id: assess
        env:
          GEN: ${{ needs.generate.result }}
          VER: ${{ needs.verify.result }}
          TEST_ALARM: ${{ inputs.test_alarm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          : > problems.md

          # A drill. Injecting the fault only when no alarm is already open
          # makes two consecutive test runs walk the whole loop: the first
          # raises the issue, the second finds it open, reports healthy, and
          # stands it down again. Testing the alarm therefore leaves nothing
          # behind, which is the only reason to trust it.
          if [ "${TEST_ALARM:-false}" = "true" ]; then
            OPEN_NOW=$(gh issue list --label pipeline-failure --state open --limit 1 --json number --jq '.[0].number // empty')
            if [ -z "$OPEN_NOW" ]; then
              echo "- Drill: this is a deliberate test of the alarm, triggered with \`test_alarm\`. Nothing is wrong. Re-run the workflow with \`test_alarm\` again and this issue will close itself." >> problems.md
            else
              echo "Drill: alarm #$OPEN_NOW is already open, reporting healthy so it stands down."
            fi
          fi

          if [ "$GEN" != "success" ]; then
            echo "- The **generate** job finished as \`$GEN\`." >> problems.md
          fi
          # verify is skipped on a dry run, which is not a failure.
          if [ "$VER" != "success" ] && [ "$VER" != "skipped" ]; then
            echo "- The **build and audit** job finished as \`$VER\`." >> problems.md
          fi

          NEWEST=$(ls src/content/briefings/*.json | xargs -n1 basename | sed 's/\.json$//' | sort | tail -1)
          TODAY=$(TZ=Europe/Dublin date +%F)
          AGE=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$NEWEST" +%s) ) / 86400 ))
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
          echo "newest briefing: $NEWEST | today: $TODAY | age: ${AGE}d"

          # One miss is a blip and self-corrects tomorrow. Two is a stall.
          if [ "$AGE" -gt 1 ]; then
            echo "- The newest briefing is \`$NEWEST\`, **$AGE days** behind today (\`$TODAY\`). The site is serving stale content." >> problems.md
          fi

          if [ -s problems.md ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise the alarm
        if: steps.assess.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The daily briefing pipeline did not complete cleanly."
            echo
            cat problems.md
            echo
            echo "Run: $RUN_URL"
            echo
            echo "This issue closes itself when a scheduled run succeeds again."
          } > body.md

          EXISTING=$(gh issue list --label pipeline-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Alarm already open as #$EXISTING, adding a comment."
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh label create pipeline-failure --color B60205               --description "The daily briefing pipeline needs attention" 2>/dev/null || true
            gh issue create --title "Daily briefing pipeline needs attention"               --label pipeline-failure --body-file body.md
          fi

      - name: Stand down the alarm
        if: steps.assess.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEWEST: ${{ steps.assess.outputs.newest }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --label pipeline-failure --state open --json number --jq '.[].number')
          if [ -z "$OPEN" ]; then
            echo "Nothing to stand down."
            exit 0
          fi
          for n in $OPEN; do
            gh issue close "$n" --comment "Recovered. Newest briefing is \`$NEWEST\`. Run: $RUN_URL"
          done
