name: Model watch

# The free NVIDIA catalogue withdraws models with little warning: Kimi K3 went
# in October 2026 and GLM 5.3 soon after, and the first anyone knew was a
# failed edition. This checks every morning, before the edition slots, that
# each model in BRIEFING_MODEL is still listed AND still answers. If one is
# gone, it opens an issue naming the replacements that are on the list now.
#
# 15:00 UTC = 23:00 Shanghai, an hour before the first edition slot.

on:
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the configured models
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODELS: ${{ vars.BRIEFING_MODEL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Not the default bash -e: one slow model must not abort the check.
        shell: bash {0}
        run: |
          set -uo pipefail
          curl -s --max-time 30 https://integrate.api.nvidia.com/v1/models -o catalogue.json
          jq -r '.data[].id' catalogue.json | sort > live.txt
          echo "catalogue: $(wc -l < live.txt) models"

          : > problems.md
          : > slow.md
          ok=0
          IFS=',' read -ra LIST <<< "${MODELS:-}"
          for m in "${LIST[@]}"; do
            m=$(echo "$m" | xargs)
            [ -z "$m" ] && continue
            if ! grep -qxF "$m" live.txt; then
              echo "- \`$m\` is **no longer listed** by NVIDIA." >> problems.md
              continue
            fi
            # Listed is not enough: Kimi K2.6 was listed and returned 404.
            # Reasoning models think first, so allow 5 minutes. A timeout is
            # reported, never allowed to abort the whole check.
            : > reply.json
            code=$(curl -s -o reply.json -w '%{http_code}' --max-time 300 \
              https://integrate.api.nvidia.com/v1/chat/completions \
              -H "Authorization: Bearer $NVIDIA_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"model\":\"$m\",\"max_tokens\":2000,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: ready\"}]}") || code=000
            text=$(jq -r '.choices[0].message.content // ""' reply.json 2>/dev/null)
            if [ "$code" = "200" ] && [ -n "$text" ]; then
              echo "ok      $m"
              ok=$((ok+1))
            elif [ "$code" = "000" ]; then
              # No answer inside 5 minutes is slow, not gone. DeepSeek V4.1 Flash
              # takes about that long to write a briefing, so a hard 5-minute
              # limit raised a false alarm every day from 17 October. It is
              # still listed and the server still accepted the call.
              echo "- \`$m\` is listed but **slow**: no reply in 5 minutes. Not an alarm." >> slow.md
              echo "SLOW    $m"
            else
              echo "- \`$m\` is listed but **does not answer** (HTTP $code)." >> problems.md
              echo "FAILED  $m (HTTP $code)"
            fi
          done

          {
            echo "### Model watch"
            echo
            echo "Configured: \`${MODELS:-unset}\` — $ok answering"
            echo
            cat problems.md slow.md
          } >> "$GITHUB_STEP_SUMMARY"

          gh label create model-watch --repo "$REPO" --color D93F0B \
            --description "A briefing model was withdrawn from NVIDIA" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label model-watch --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ ! -s problems.md ]; then
            echo "all configured models are fine"
            # Stand down: an alarm that never closes teaches people to ignore it.
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$REPO" \
                --comment "Recovered. Every configured model is listed and none returned an error. Run: $RUN_URL"
            fi
            exit 0
          fi

          {
            echo "A model the daily briefing relies on has gone. **$ok** of the configured models still work."
            echo
            cat problems.md
            echo
            if [ "$ok" = "0" ]; then
              echo "**No configured model works. The next edition will fail.**"
              echo
            fi
            echo "Larger chat models on the NVIDIA list today, to test with the Model bake-off workflow:"
            echo
            grep -iE 'nemotron-3|nemotron-4-340|mistral-large|gemma-4|step-|palmyra-creative|deepseek-v|glm-|kimi-|qwen|llama-4|gpt-oss' live.txt \
              | grep -viE 'embed|safety|reward|parse|nano|vl-|omni' | sed 's/^/- `/; s/$/`/'
            echo
            echo "Change the model: Settings > Secrets and variables > Actions > Variables > BRIEFING_MODEL"
            echo
            echo "Run: $RUN_URL"
          } > body.md

          if [ -n "$open" ]; then
            # Comment only when the problem is new. The same line repeated every
            # morning is noise, and the issue already says it.
            seen=$(gh issue view "$open" --repo "$REPO" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")')
            new=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              printf '%s' "$seen" | grep -qF -- "$line" || new=1
            done < problems.md
            if [ "$new" = "1" ]; then
              gh issue comment "$open" --repo "$REPO" --body-file body.md
            else
              echo "alarm #$open already reports this, no new comment"
            fi
          else
            gh issue create --repo "$REPO" --title "A briefing model was withdrawn from NVIDIA" \
              --label model-watch --body-file body.md
          fi
